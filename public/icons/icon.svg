<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Coords are in the 48px grid below, since that's the user space the
         gradient is referenced from once the group transform applies. -->
    <linearGradient id="orbitIconGrad" x1="8" y1="40" x2="40" y2="8" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0F172A"/>

  <!-- Same construction as components/brand/OrbitLogo.tsx, scaled from a 48px grid -->
  <g transform="translate(256 256) scale(8.5) translate(-24 -24)" fill="none">
    <g stroke="url(#orbitIconGrad)" stroke-width="1.7" stroke-linecap="round">
      <circle cx="24" cy="24" r="14"/>
      <ellipse cx="24" cy="24" rx="7" ry="14" transform="rotate(-24 24 24)"/>
      <ellipse cx="24" cy="24" rx="7" ry="14" transform="rotate(24 24 24)"/>
      <ellipse cx="24" cy="24" rx="14" ry="7.5" transform="rotate(-32 24 24)"/>
    </g>
    <g stroke="url(#orbitIconGrad)" stroke-width="1.6" fill="#0F172A">
      <circle cx="37.5" cy="11.5" r="2.9"/>
      <circle cx="10.5" cy="36.5" r="2.9"/>
      <circle cx="32.2" cy="19.4" r="2.2"/>
      <circle cx="15.8" cy="28.6" r="2.2"/>
      <circle cx="30.6" cy="28.9" r="2.2"/>
    </g>
  </g>
</svg>
